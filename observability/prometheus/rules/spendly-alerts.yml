groups:
  - name: spendly-local-observability
    rules:
      - alert: SpendlyEndpointProbeFailed
        expr: probe_success{job="spendly-blackbox"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Spendly {{ $labels.target }} probe is failing"
          description: "Blackbox probing has failed for {{ $labels.instance }} for at least one minute."

      - alert: SpendlyAppMetricsMissing
        expr: up{job="spendly-app"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Spendly application metrics target is down"
          description: "Prometheus has been unable to scrape Spendly /metrics for at least one minute."

      - alert: SpendlyHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(spendly_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Spendly p95 application latency is above 500 ms"
          description: "The five-minute p95 for instrumented business requests has remained above 500 ms for five minutes."

      - alert: SpendlyHighServerErrorRatio
        expr: (sum(rate(spendly_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(spendly_http_requests_total[5m])), 0.001)) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Spendly 5xx ratio is above 5%"
          description: "More than 5% of instrumented business requests have returned 5xx responses for five minutes."
