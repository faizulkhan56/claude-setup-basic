# Phase 2 — install at /etc/nginx/sites-available/spendly, then:
#   ln -sf /etc/nginx/sites-available/spendly /etc/nginx/sites-enabled/spendly
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# server_name is an sslip.io name derived from the Elastic IP once it is
# allocated (dots -> dashes), e.g. an IP of 13.250.1.2 becomes
# 13-250-1-2.sslip.io. It resolves without owning a domain, which is what
# lets certbot's HTTP-01 challenge succeed. Replace the placeholder below
# after `aws ec2 allocate-address` / `associate-address` in the handover.
server {
    listen 80;
    server_name <elastic-ip-with-dashes>.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <elastic-ip-with-dashes>.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/<elastic-ip-with-dashes>.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<elastic-ip-with-dashes>.sslip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
