name: Apply blog observability update

on:
  push:
    paths:
      - '.tmp-blog-update/ready'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply article patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp-blog-update/article.patch.gz.b64 | gzip -d > /tmp/article.patch
          git apply --check /tmp/article.patch
          git apply /tmp/article.patch

      - name: Remove one-time updater and commit final article
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-blog-update
          rm -f .github/workflows/apply-blog-observability-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add AI-assisted observability chapter"
          git push origin HEAD:main
